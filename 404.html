<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 - Page Not Found | ezoi.me</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      opacity: 0.15;
      background-image: 
        linear-gradient(to right, rgba(140, 161, 255, 0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(140, 161, 255, 0.2) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: -1;
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: bold;
      background: linear-gradient(90deg, #6f7bff, #20d7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 10px;
      line-height: 1;
    }
    .error-message {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      margin: 10px 0 40px;
      color: var(--muted);
      max-width: 500px;
    }
    .return-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 40px;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      font-weight: 600;
      color: white;
      background: linear-gradient(140deg, #6f7bff, #20d7ff);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(111, 123, 255, 0.4);
      transition: all 0.3s ease;
    }
    .return-btn:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 15px 40px rgba(111, 123, 255, 0.5);
    }

    /* Extra responsiveness */
    @media (max-width: 480px) {
      .error-page {
        padding: 15px;
      }
      .return-btn {
        padding: 14px 32px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="error-page">
    <h1 class="error-code">404</h1>
    <p class="error-message">Oops! The page you're looking for doesn't exist.</p>

    <a href="/" class="return-btn">
      ← Return to ezoi.me
    </a>
  </div>

  <script>
    // Map retired tool URLs (/tools/<name>/) to the tools hub with a 301-style redirect.
    (function () {
      var REDIRECTS = {
        "/tools/word-counter": "/tools/",
        "/tools/case-converter": "/tools/",
        "/tools/base64": "/tools/",
        "/tools/json-formatter": "/tools/",
        "/tools/url-encoder": "/tools/",
        "/tools/password-generator": "/tools/",
        "/tools/color-converter": "/tools/",
        "/tools/timestamp-converter": "/tools/",
        "/tools/text-diff": "/tools/",
        "/tools/lorem-ipsum": "/tools/",
        "/tools/tools/_q_category_e_ai-and-machine-learning": "/tools/ai-and-machine-learning/",
        "/tools/tools/_q_category_e_cloud-and-hosting": "/tools/cloud-and-hosting/",
        "/tools/tools/_q_category_e_design-and-creative": "/tools/design-and-creative/",
        "/tools/tools/_q_category_e_development-tools": "/tools/development-tools/",
        "/tools/tools/_q_category_e_food-and-dining": "/tools/food-and-dining/",
        "/tools/tools/_q_category_e_health-and-wellness": "/tools/health-and-wellness/",
        "/tools/tools/_q_category_e_learning-and-education": "/tools/learning-and-education/",
        "/tools/tools/_q_category_e_marketing-and-growth": "/tools/marketing-and-growth/",
        "/tools/tools/_q_category_e_media-and-entertainment": "/tools/media-and-entertainment/",
        "/tools/tools/_q_category_e_productivity": "/tools/productivity/",
        "/tools/tools/_q_category_e_science-and-research": "/tools/science-and-research/",
        "/tools/tools/_q_category_e_security-and-privacy": "/tools/security-and-privacy/",
        "/tools/tools/_q_category_e_shopping-and-lifestyle": "/tools/shopping-and-lifestyle/",
        "/tools/tools/_q_category_e_student-memberships": "/tools/student-memberships/",
        "/tools/tools/_q_category_e_travel-and-finance": "/tools/travel-and-finance/",
        "/tools/tools/_q_category_e_github": "/tools/development-tools/",
        "/tools/tools/_q_focus_e_Azure": "/tools/offer/microsoft-azure/",
        "/tools/tools/_q_focus_e_Google-20Cloud": "/tools/cloud-and-hosting/",
        "/tools/tools/_q_q_e_Amazon-Prime": "/tools/offer/amazon-prime/",
        "/tools/tools/_q_q_e_Apple-Education": "/tools/offer/apple-education/",
        "/tools/tools/_q_q_e_Microsoft-365": "/tools/offer/microsoft-365/",
        "/tools/tools/_q_q_e_Perplexity-Pro": "/tools/tools/",
        "/tools/tools/_q_q_e_Spotify": "/tools/offer/spotify-premium-student/"
      };
      var p = location.pathname.replace(/\/+$/, "") || "/";
      if (REDIRECTS[p]) {
        // Replace state so back button doesn't loop; treat as permanent move.
        window.location.replace(REDIRECTS[p]);
      }
    })();
  </script>
</body>
</html>
