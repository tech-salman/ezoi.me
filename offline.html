<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Offline | ezoi.me</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .offline-page {
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 24px; background: var(--bg); color: var(--text);
    }
    .offline-icon { font-size: clamp(3rem, 12vw, 5rem); margin-bottom: 12px; }
    .offline-page h1 {
      font-size: clamp(1.5rem, 6vw, 2.4rem); margin: 0 0 12px;
      background: linear-gradient(90deg, #6f7bff, #20d7ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .offline-page p { color: var(--muted); max-width: 460px; margin: 0 0 28px; }
    .offline-btn {
      display: inline-block; padding: 14px 34px; border: none; cursor: pointer;
      font-size: 1rem; font-weight: 600; color: #fff; border-radius: 50px;
      background: linear-gradient(140deg, #6f7bff, #20d7ff);
      box-shadow: 0 10px 30px rgba(111,123,255,.4); text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="offline-page">
    <div class="offline-icon" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>This page isn't cached yet. Check your connection and try again — cached pages of ezoi.me still work offline.</p>
    <button class="offline-btn" type="button" onclick="location.reload()">Retry</button>
    <p style="margin-top:24px"><a href="/" style="color:#8fdbff;">← Back to home</a></p>
  </div>
</body>
</html>
