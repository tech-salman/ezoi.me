  <link rel="stylesheet" href="../styles.css" />
  <style>
    .domains-page { min-height: 100vh; padding: 40px 20px; background: var(--bg); color: var(--text); }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 60px; }
    .header h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      background: linear-gradient(90deg, #6f7bff, #20d7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .domains-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    .domain-card {
      background: var(--surface-strong);
      border: 1px solid rgba(111, 123, 255, 0.3);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      transition: all 0.4s ease;
    }
    .domain-card:hover {
      transform: translateY(-12px) scale(1.03);
      border-color: #20d7ff;
    }
    .domain-name { font-size: 1.55rem; font-weight: 700; margin: 16px 0 8px; }
    .domain-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 36px;
      background: linear-gradient(140deg, #6f7bff, #20d7ff);
      color: white;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(111, 123, 255, 0.4);
      transition: all 0.3s ease;
    }
    .domain-btn:hover { transform: scale(1.08); box-shadow: 0 12px 30px rgba(32, 215, 255, 0.5); }
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
