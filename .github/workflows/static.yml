# Deploy static content to GitHub Pages.
#
# This repo's Pages source is "Deploy from a branch" (branch: main, path: /),
# so GitHub Pages serves files directly from main on every push — no
# actions/deploy-pages step is needed (and using one 404s in branch mode).
# This workflow just checks out and verifies the build stays green.

name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sanity check
        run: |
          test -f index.html || (echo "index.html missing" && exit 1)
          echo "Site content present; GitHub Pages serves from main automatically."
