<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate placeholder Lorem Ipsum text by paragraph, sentence, or word count." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lorem Ipsum Generator - ezoi.me Tools" />
  <meta property="og:description" content="Generate placeholder Lorem Ipsum text by paragraph, sentence, or word count." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>Lorem Ipsum Generator - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../tools.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/tools/">Tools</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>
  <main class="page">
    <header class="top-banner">
      <h1>🧰 Lorem Ipsum Generator</h1>
      <p>Placeholder text for designs and mockups.</p>
    </header>
<section class="panel">

      <div class="tool-grid-3">
        <div class="tool-field">
          <label for="count">Count</label>
          <input type="number" id="count" class="tool-input" value="3" min="1" max="100" />
        </div>
        <div class="tool-field">
          <label for="unit">Unit</label>
          <select id="unit" class="tool-select">
            <option value="paragraphs">Paragraphs</option>
            <option value="sentences">Sentences</option>
            <option value="words">Words</option>
          </select>
        </div>
      </div>
      <div class="tool-btn-row">
        <button class="download-btn" id="gen">Generate</button>
        <button class="download-btn" id="copy">Copy</button>
      </div>
      <div class="tool-field" style="margin-top:16px;"><label for="out">Output</label><textarea id="out" class="tool-textarea" readonly></textarea></div>
      <a class="back-link" href="/tools/">← Back to Tools</a>
  
</section>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>

<script>
    function copyText(btn, text){
      navigator.clipboard.writeText(text).then(()=>{
        const old=btn.textContent; btn.textContent='Copied!'; btn.classList.add('copy-ok');
        setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copy-ok'); }, 1200);
      }).catch(()=>{ alert('Copy failed'); });
    }

    const words=('lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum').split(' ');
    const out=document.getElementById('out');
    function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
    function sentence(){ const n=8+Math.floor(Math.random()*7); let s=[]; for(let i=0;i<n;i++) s.push(words[Math.floor(Math.random()*words.length)]); return cap(s.join(' '))+'.'; }
    function para(){ const n=4+Math.floor(Math.random()*4); let s=[]; for(let i=0;i<n;i++) s.push(sentence()); return s.join(' '); }
    document.getElementById('gen').addEventListener('click',()=>{
      const c=Math.max(1,Math.min(100,parseInt(document.getElementById('count').value,10)||1));
      const u=document.getElementById('unit').value; let res='';
      if(u==='paragraphs'){ let p=[]; for(let i=0;i<c;i++) p.push(para()); res=p.join('\n\n'); }
      else if(u==='sentences'){ let p=[]; for(let i=0;i<c;i++) p.push(sentence()); res=p.join(' '); }
      else { let w=[]; for(let i=0;i<c;i++) w.push(words[Math.floor(Math.random()*words.length)]); res=cap(w.join(' '))+'.'; }
      out.value=res;
    });
    document.getElementById('copy').addEventListener('click',e=>copyText(e.target,out.value));
    document.getElementById('gen').click();
  
</script>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>
