<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Format, validate, and pretty-print JSON in your browser." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="JSON Formatter - ezoi.me Tools" />
  <meta property="og:description" content="Format, validate, and pretty-print JSON in your browser." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>JSON Formatter - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../tools.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/tools/">Tools</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>
  <main class="page">
    <header class="top-banner">
      <h1>🧰 JSON Formatter</h1>
      <p>Pretty-print and validate JSON instantly.</p>
    </header>
<section class="panel">

      <div class="tool-field"><label for="in">JSON input</label><textarea id="in" class="tool-textarea" placeholder='{"name":"Salman","tools":["json"]}'></textarea></div>
      <div class="tool-btn-row">
        <button class="download-btn" id="fmt">Format / Validate</button>
        <button class="download-btn" id="min">Minify</button>
      </div>
      <div class="tool-field" style="margin-top:16px;"><label for="out">Output</label><textarea id="out" class="tool-textarea" readonly></textarea></div>
      <div class="tool-btn-row"><button class="download-btn" id="copy">Copy Output</button></div>
      <p class="tool-note" id="msg"></p>
      <a class="back-link" href="/tools/">← Back to Tools</a>
  
</section>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>

<script>
    function copyText(btn, text){
      navigator.clipboard.writeText(text).then(()=>{
        const old=btn.textContent; btn.textContent='Copied!'; btn.classList.add('copy-ok');
        setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copy-ok'); }, 1200);
      }).catch(()=>{ alert('Copy failed'); });
    }

    const inp=document.getElementById('in'), out=document.getElementById('out'), msg=document.getElementById('msg');
    document.getElementById('fmt').addEventListener('click',()=>{ msg.textContent=''; try{ const o=JSON.parse(inp.value); out.value=JSON.stringify(o,null,2); msg.textContent='Valid JSON ✓'; }catch(e){ msg.textContent='Invalid: '+e.message; } });
    document.getElementById('min').addEventListener('click',()=>{ msg.textContent=''; try{ const o=JSON.parse(inp.value); out.value=JSON.stringify(o); msg.textContent='Valid JSON ✓ (minified)'; }catch(e){ msg.textContent='Invalid: '+e.message; } });
    document.getElementById('copy').addEventListener('click',e=>copyText(e.target,out.value));
  
</script>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>
