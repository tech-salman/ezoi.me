<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Convert colors between HEX, RGB, and HSL formats." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Color Converter - ezoi.me Tools" />
  <meta property="og:description" content="Convert colors between HEX, RGB, and HSL formats." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>Color Converter - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../tools.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/tools/">Tools</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>
  <main class="page">
    <header class="top-banner">
      <h1>🧰 Color Converter</h1>
      <p>HEX, RGB, and HSL — with live preview.</p>
    </header>
<section class="panel">

      <div class="tool-field">
        <label for="hex">HEX</label>
        <input type="text" id="hex" class="tool-input" value="#6f7bff" />
      </div>
      <div class="tool-swatch" id="sw"></div>
      <div class="tool-field" style="margin-top:14px;"><label for="rgb">RGB</label><input type="text" id="rgb" class="tool-input" readonly /></div>
      <div class="tool-field"><label for="hsl">HSL</label><input type="text" id="hsl" class="tool-input" readonly /></div>
      <div class="tool-btn-row"><button class="download-btn" id="copy">Copy HEX</button></div>
      <a class="back-link" href="/tools/">← Back to Tools</a>
  
</section>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>

<script>
    function copyText(btn, text){
      navigator.clipboard.writeText(text).then(()=>{
        const old=btn.textContent; btn.textContent='Copied!'; btn.classList.add('copy-ok');
        setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copy-ok'); }, 1200);
      }).catch(()=>{ alert('Copy failed'); });
    }

    const hex=document.getElementById('hex'), rgb=document.getElementById('rgb'), hsl=document.getElementById('hsl'), sw=document.getElementById('sw');
    function toHsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h,s,l=(mx+mn)/2;
      if(mx===mn){h=s=0;} else { const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn);
        switch(mx){ case r:h=(g-b)/d+(g<b?6:0);break; case g:h=(b-r)/d+2;break; default:h=(r-g)/d+4;} h/=6; }
      return [Math.round(h*360),Math.round(s*100),Math.round(l*100)]; }
    function update(){
      let v=hex.value.trim().replace('#','');
      if(v.length===3) v=v.split('').map(c=>c+c).join('');
      if(!/^[0-9a-fA-F]{6}$/.test(v)){ sw.style.background='transparent'; rgb.value=hsl.value=''; return; }
      const r=parseInt(v.slice(0,2),16),g=parseInt(v.slice(2,4),16),b=parseInt(v.slice(4,6),16);
      sw.style.background='#'+v;
      rgb.value='rgb('+r+', '+g+', '+b+')';
      const [h,s,l]=toHsl(r,g,b); hsl.value='hsl('+h+', '+s+'%, '+l+'%)';
    }
    hex.addEventListener('input',update);
    document.getElementById('copy').addEventListener('click',e=>copyText(e.target,'#'+hex.value.trim().replace('#','')));
    update();
  
</script>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {

    };

      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>
