<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate strong random passwords and passphrases in your browser." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Password Generator - ezoi.me Tools" />
  <meta property="og:description" content="Generate strong random passwords and passphrases in your browser." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>Password Generator - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../tools.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/tools/">Tools</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>
  <main class="page">
    <header class="top-banner">
      <h1>🧰 Password Generator</h1>
      <p>Strong random passwords, generated locally.</p>
    </header>
<section class="panel">

      <div class="tool-field">
        <label for="pw">Generated password</label>
        <input type="text" id="pw" class="tool-input" readonly />
      </div>
      <div class="tool-btn-row"><button class="download-btn" id="gen">Generate</button><button class="download-btn" id="copy">Copy</button></div>
      <div class="tool-field" style="margin-top:16px;">
        <label>Length: <output id="lenout">16</output></label>
        <div class="tool-range-row"><input type="range" id="len" class="tool-input" min="4" max="64" value="16" /></div>
      </div>
      <div class="tool-field">
        <label class="tool-check"><input type="checkbox" id="upper" checked /> Uppercase (A-Z)</label>
        <label class="tool-check"><input type="checkbox" id="lower" checked /> Lowercase (a-z)</label>
        <label class="tool-check"><input type="checkbox" id="num" checked /> Numbers (0-9)</label>
        <label class="tool-check"><input type="checkbox" id="sym" checked /> Symbols (!@#$…)</label>
      </div>
      <p class="tool-note" id="strength"></p>
      <a class="back-link" href="/tools/">← Back to Tools</a>
  
</section>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>

<script>
    function copyText(btn, text){
      navigator.clipboard.writeText(text).then(()=>{
        const old=btn.textContent; btn.textContent='Copied!'; btn.classList.add('copy-ok');
        setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copy-ok'); }, 1200);
      }).catch(()=>{ alert('Copy failed'); });
    }

    const pw=document.getElementById('pw'), len=document.getElementById('len'), lenout=document.getElementById('lenout'), strength=document.getElementById('strength');
    const sets={upper:'ABCDEFGHJKLMNPQRSTUVWXYZ',lower:'abcdefghijkmnopqrstuvwxyz',num:'23456789',sym:'!@#$%^&*()-_=+[]{};:,.?'};
    function gen(){
      const L=+len.value; const opts=Object.keys(sets).filter(k=>document.getElementById(k).checked);
      if(!opts.length){ pw.value=''; strength.textContent='Select at least one option'; return; }
      let pool=opts.map(k=>sets[k]).join(''), out='';
      const arr=new Uint32Array(L); crypto.getRandomValues(arr);
      for(let i=0;i<L;i++) out+=pool[arr[i]%pool.length];
      pw.value=out;
      strength.textContent='Strength: '+(L>=16?'Strong':L>=10?'Medium':'Weak');
    }
    len.addEventListener('input',()=>{ lenout.textContent=len.value; gen(); });
    ['upper','lower','num','sym'].forEach(k=>document.getElementById(k).addEventListener('change',gen));
    document.getElementById('gen').addEventListener('click',gen);
    document.getElementById('copy').addEventListener('click',e=>copyText(e.target,pw.value));
    gen();
  
</script>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>
