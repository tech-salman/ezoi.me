<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Convert between Unix timestamps and human-readable dates." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Timestamp Converter - ezoi.me Tools" />
  <meta property="og:description" content="Convert between Unix timestamps and human-readable dates." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>Timestamp Converter - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../tools.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/tools/">Tools</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>
  <main class="page">
    <header class="top-banner">
      <h1>🧰 Timestamp Converter</h1>
      <p>Unix timestamp ⇄ readable date.</p>
    </header>
<section class="panel">

      <div class="tool-grid">
        <div class="tool-field"><label for="ts">Unix timestamp (seconds)</label><input type="text" id="ts" class="tool-input" placeholder="1690000000" /></div>
        <div class="tool-field"><label for="dt">Date / time</label><input type="datetime-local" id="dt" class="tool-input" /></div>
      </div>
      <div class="tool-btn-row">
        <button class="download-btn" id="t2d">Timestamp → Date</button>
        <button class="download-btn" id="d2t">Date → Timestamp</button>
        <button class="download-btn" id="now">Now</button>
      </div>
      <div class="tool-field" style="margin-top:16px;"><label for="out">Result (UTC)</label><textarea id="out" class="tool-textarea" readonly></textarea></div>
      <div class="tool-btn-row"><button class="download-btn" id="copy">Copy Result</button></div>
      <a class="back-link" href="/tools/">← Back to Tools</a>
  
</section>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>

<script>
    function copyText(btn, text){
      navigator.clipboard.writeText(text).then(()=>{
        const old=btn.textContent; btn.textContent='Copied!'; btn.classList.add('copy-ok');
        setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copy-ok'); }, 1200);
      }).catch(()=>{ alert('Copy failed'); });
    }

    const ts=document.getElementById('ts'), dt=document.getElementById('dt'), out=document.getElementById('out');
    function pad(n){ return String(n).padStart(2,'0'); }
    function fmt(d){ return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())+' UTC'; }
    document.getElementById('t2d').addEventListener('click',()=>{ const v=parseInt(ts.value,10); if(isNaN(v)){out.value='Enter a valid timestamp';return;} const d=new Date(v*1000); out.value=fmt(d); });
    document.getElementById('d2t').addEventListener('click',()=>{ const d=new Date(dt.value); if(isNaN(d.getTime())){out.value='Pick a date';return;} out.value=Math.floor(d.getTime()/1000); });
    document.getElementById('now').addEventListener('click',()=>{ const d=new Date(); ts.value=Math.floor(d.getTime()/1000); out.value=fmt(d); });
    document.getElementById('copy').addEventListener('click',e=>copyText(e.target,out.value));
  
</script>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>
