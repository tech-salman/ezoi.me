<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Convert text between uppercase, lowercase, title case, sentence case, and more." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Case Converter - ezoi.me Tools" />
  <meta property="og:description" content="Convert text between uppercase, lowercase, title case, sentence case, and more." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>Case Converter - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../tools.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/tools/">Tools</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>
  <main class="page">
    <header class="top-banner">
      <h1>🧰 Case Converter</h1>
      <p>Transform text casing with one click.</p>
    </header>
<section class="panel">

      <div class="tool-field"><label for="in">Input text</label><textarea id="in" class="tool-textarea" placeholder="Type or paste text..."></textarea></div>
      <div class="tool-btn-row">
        <button class="download-btn" data-fn="upper">UPPERCASE</button>
        <button class="download-btn" data-fn="lower">lowercase</button>
        <button class="download-btn" data-fn="title">Title Case</button>
        <button class="download-btn" data-fn="sentence">Sentence case</button>
        <button class="download-btn" data-fn="camel">camelCase</button>
        <button class="download-btn" data-fn="toggle">tOGGLE</button>
      </div>
      <div class="tool-field" style="margin-top:16px;"><label for="out">Output</label><textarea id="out" class="tool-textarea" readonly></textarea></div>
      <div class="tool-btn-row"><button class="download-btn" id="copy">Copy Output</button></div>
      <a class="back-link" href="/tools/">← Back to Tools</a>
  
</section>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>

<script>
    function copyText(btn, text){
      navigator.clipboard.writeText(text).then(()=>{
        const old=btn.textContent; btn.textContent='Copied!'; btn.classList.add('copy-ok');
        setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copy-ok'); }, 1200);
      }).catch(()=>{ alert('Copy failed'); });
    }

    const inp=document.getElementById('in'), out=document.getElementById('out');
    const ops={
      upper:s=>s.toUpperCase(),
      lower:s=>s.toLowerCase(),
      title:s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()),
      sentence:s=>s.toLowerCase().replace(/(^|\.\s+|\?\s+|!\s+)(\w)/g,(_,a,b)=>a+b.toUpperCase()),
      camel:s=>s.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(_,c)=>c.toUpperCase()),
      toggle:s=>s.split('').map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('')
    };
    document.querySelectorAll('[data-fn]').forEach(b=>b.addEventListener('click',()=>{ out.value=ops[b.dataset.fn](inp.value); }));
    document.getElementById('copy').addEventListener('click',e=>copyText(e.target,out.value));
  
</script>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>
