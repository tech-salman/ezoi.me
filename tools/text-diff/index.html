<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Compare two blocks of text and highlight added/removed lines." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Text Diff - ezoi.me Tools" />
  <meta property="og:description" content="Compare two blocks of text and highlight added/removed lines." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>Text Diff - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../tools.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/tools/">Tools</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>
  <main class="page">
    <header class="top-banner">
      <h1>🧰 Text Diff</h1>
      <p>Compare two versions and see what changed.</p>
    </header>
<section class="panel">

      <div class="tool-grid">
        <div class="tool-field"><label for="a">Original</label><textarea id="a" class="tool-textarea" placeholder="Paste original text..."></textarea></div>
        <div class="tool-field"><label for="b">Changed</label><textarea id="b" class="tool-textarea" placeholder="Paste changed text..."></textarea></div>
      </div>
      <div class="tool-btn-row"><button class="download-btn" id="cmp">Compare</button></div>
      <div class="tool-result" style="margin-top:14px;"><div class="tool-out" id="out"></div></div>
      <p class="tool-note" id="msg"></p>
      <a class="back-link" href="/tools/">← Back to Tools</a>
  
</section>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>

<script>

    const a=document.getElementById('a'), b=document.getElementById('b'), out=document.getElementById('out'), msg=document.getElementById('msg');
    document.getElementById('cmp').addEventListener('click',()=>{
      const A=a.value.split('\n'), B=b.value.split('\n');
      const setB=new Set(B); const setA=new Set(A);
      let html='', add=0, del=0;
      A.forEach(line=>{ if(!setB.has(line)){ html+='<div style="color:#ff9b9b;">- '+line.replace(/</g,"&lt;")+'</div>'; del++; } });
      B.forEach(line=>{ if(!setA.has(line)){ html+='<div style="color:#8cffb0;">+ '+line.replace(/</g,"&lt;")+'</div>'; add++; } });
      out.innerHTML=html||'<span class="muted">No differences found.</span>';
      msg.textContent='Removed: '+del+' line(s), Added: '+add+' line(s).';
    });
  
</script>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>
