<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Count words, characters, sentences, and lines in your text instantly." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Word & Character Counter - ezoi.me Tools" />
  <meta property="og:description" content="Count words, characters, sentences, and lines in your text instantly." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>Word & Character Counter - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .tool-page { min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 960px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 26px; }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      background: linear-gradient(90deg, #6f7bff, #20d7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 6px;
    }
    .header p { color: var(--muted); margin: 0; font-size: 1rem; }
    .panel { background: var(--surface); border: 1px solid rgba(134,157,255,0.35); border-radius: 14px; padding: 18px; box-shadow: 0 10px 24px rgba(6,10,28,0.6); backdrop-filter: blur(6px); }
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 0.9rem; }
    textarea, input[type="text"], input[type="number"], input[type="datetime-local"], select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(163,185,255,0.45); background: rgba(8,12,28,0.7);
      color: var(--text); font-size: 0.95rem; font-family: inherit; resize: vertical;
    }
    textarea { min-height: 150px; }
    textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(32,215,255,0.25); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(176,208,255,0.75);
      background: linear-gradient(140deg, rgba(89,115,255,0.45), rgba(39,198,255,0.45));
      color: #f4f8ff; font-size: 0.92rem; font-weight: 600; transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:hover { background: linear-gradient(140deg, rgba(98,126,255,0.6), rgba(44,204,255,0.6)); transform: translateY(-1px); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .result { margin-top: 14px; }
    .result .out {
      white-space: pre-wrap; word-break: break-word; background: rgba(8,12,28,0.7);
      border: 1px solid rgba(163,185,255,0.35); border-radius: 10px; padding: 12px; color: var(--text);
      font-size: 0.95rem; min-height: 24px;
    }
    .stat { display: inline-block; margin: 4px 10px 4px 0; color: var(--muted); font-size: 0.92rem; }
    .stat b { color: var(--text); }
    .note { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
    .swatch { width: 100%; height: 60px; border-radius: 10px; border: 1px solid rgba(163,185,255,0.45); }
    .copy-ok { color: #6dffa8 !important; }
    .range-row { display:flex; align-items:center; gap:10px; }
    .range-row input[type=range]{ flex:1; }
    .range-row output{ min-width:36px; text-align:center; color:var(--text); }
    .back-link { display:inline-block; margin-top:18px; color:#8fdbff; text-decoration:underline; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid rgba(163,185,255,0.4); background:rgba(255,255,255,0.06); color:var(--muted); font-size:0.82rem; margin:2px 4px 2px 0; }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/">Home</a>
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>

  <div class="tool-page"><div class="container">
    <div class="header"><h1>📝 Word &amp; Character Counter</h1><p>Paste or type text to analyze it live.</p></div>
    <div class="panel">
      <div class="field">
        <label for="txt">Your text</label>
        <textarea id="txt" placeholder="Type or paste text here..."></textarea>
      </div>
      <div id="stats">
        <span class="stat">Words: <b id="words">0</b></span>
        <span class="stat">Characters: <b id="chars">0</b></span>
        <span class="stat">Characters (no spaces): <b id="charsns">0</b></span>
        <span class="stat">Sentences: <b id="sent">0</b></span>
        <span class="stat">Lines: <b id="lines">0</b></span>
        <span class="stat">Reading time: <b id="read">0s</b></span>
      </div>
    </div>
    <a class="back-link" href="/tools/">← Back to Tools</a>
  </div></div>
  <script>
    const txt=document.getElementById('txt');
    function update(){
      const v=txt.value;
      const words=(v.trim().match(/\S+/g)||[]).length;
      const chars=v.length;
      const charsns=v.replace(/\s/g,'').length;
      const sent=(v.match(/[^.!?]+[.!?]+/g)||[]).length;
      const lines=v.split(/\n/).length;
      const sec=Math.ceil(words/200);
      document.getElementById('words').textContent=words;
      document.getElementById('chars').textContent=chars;
      document.getElementById('charsns').textContent=charsns;
      document.getElementById('sent').textContent=sent;
      document.getElementById('lines').textContent=lines||0;
      document.getElementById('read').textContent=sec+'s';
    }
    txt.addEventListener('input',update);
  </script>
  
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => { sidebarMenu.classList.remove('is-open'); menuOverlay.hidden = true; menuToggle.setAttribute('aria-expanded','false'); sidebarMenu.setAttribute('aria-hidden','true'); };
    const openMenu = () => { sidebarMenu.classList.add('is-open'); menuOverlay.hidden = false; menuToggle.setAttribute('aria-expanded','true'); sidebarMenu.setAttribute('aria-hidden','false'); };
    menuToggle.addEventListener('click', () => { sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu(); });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu(); });
  </script>
</body>
</html>
