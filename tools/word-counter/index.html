<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Count words, characters, sentences, and lines in your text instantly." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Word & Character Counter - ezoi.me Tools" />
  <meta property="og:description" content="Count words, characters, sentences, and lines in your text instantly." />
  <meta property="og:site_name" content="Muhammad Salman Nadeem Portfolio" />
  <title>Word & Character Counter - ezoi.me Tools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../tools.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-menu">☰</button>
  <div class="menu-overlay" hidden></div>
  <aside class="sidebar-menu" id="sidebar-menu" aria-hidden="true">
    <nav class="sidebar-nav" aria-label="Sidebar">
      <a href="/blogs/">Blogs</a>
      <a href="/pages/">Web Pages</a>
      <a href="/tools/">Tools</a>
      <a href="/islamAI/">Islam AI</a>
    </nav>
  </aside>
  <main class="page">
    <header class="top-banner">
      <h1>🧰 Word & Character Counter</h1>
      <p>Count words, characters, sentences, and lines live.</p>
    </header>
<section class="panel">

      <p class="tool-intro">Paste or type text to analyze it live.</p>
      <div class="tool-field">
        <label for="txt">Your text</label>
        <textarea id="txt" class="tool-textarea" placeholder="Type or paste text here..."></textarea>
      </div>
      <div>
        <span class="tool-stat">Words: <b id="words">0</b></span>
        <span class="tool-stat">Characters: <b id="chars">0</b></span>
        <span class="tool-stat">Characters (no spaces): <b id="charsns">0</b></span>
        <span class="tool-stat">Sentences: <b id="sent">0</b></span>
        <span class="tool-stat">Lines: <b id="lines">0</b></span>
        <span class="tool-stat">Reading time: <b id="read">0s</b></span>
      </div>
      <a class="back-link" href="/tools/">← Back to Tools</a>
  
</section>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>

<script>

    const txt=document.getElementById('txt');
    function update(){
      const v=txt.value;
      const words=(v.trim().match(/\S+/g)||[]).length;
      const chars=v.length;
      const charsns=v.replace(/\s/g,'').length;
      const sent=(v.match(/[^.!?]+[.!?]+/g)||[]).length;
      const lines=v.split(/\n/).length;
      const sec=Math.ceil(words/200);
      document.getElementById('words').textContent=words;
      document.getElementById('chars').textContent=chars;
      document.getElementById('charsns').textContent=charsns;
      document.getElementById('sent').textContent=sent;
      document.getElementById('lines').textContent=lines||0;
      document.getElementById('read').textContent=sec+'s';
    }
    txt.addEventListener('input',update);
  
</script>

  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    const closeMenu = () => {
      sidebarMenu.classList.remove('is-open');
      menuOverlay.hidden = true;
      menuToggle.setAttribute('aria-expanded', 'false');
      sidebarMenu.setAttribute('aria-hidden', 'true');
    };
    const openMenu = () => {
      sidebarMenu.classList.add('is-open');
      menuOverlay.hidden = false;
      menuToggle.setAttribute('aria-expanded', 'true');
      sidebarMenu.setAttribute('aria-hidden', 'false');
    };
    menuToggle.addEventListener('click', () => {
      sidebarMenu.classList.contains('is-open') ? closeMenu() : openMenu();
    });
    menuOverlay.addEventListener('click', closeMenu);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarMenu.classList.contains('is-open')) closeMenu();
    });
  </script>
</body>
</html>
